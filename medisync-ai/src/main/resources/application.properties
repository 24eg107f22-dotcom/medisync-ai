server.port=8080
spring.application.name=medisync-backend
spring.profiles.include=local

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medisync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Settings
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Email Notification Configuration (Gmail SMTP example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-clinic-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
spring.ai.google.genai.api-key=${gemini.api.key}

# JWT Configuration
medisync.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
medisync.app.jwtExpirationMs=86400000
